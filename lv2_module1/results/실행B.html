  step*=mag;
  const t0=Math.ceil(mn/step)*step; const arr=[];
  for(let v=t0; v<=mx+1e-9; v+=step) arr.push(+v.toFixed(6));
  return {ticks:arr, step};
}
function draw(){
  sizeCanvas();
  const dpr = window.devicePixelRatio||1;
  const W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  const [xa,xb]=curX(); const [ya,yb]=yRange();
  const X=v=>pad.l*dpr+(v-xa)/(xb-xa)*(W-pad.l*dpr-pad.r*dpr);
  const Y=v=>pad.t*dpr+(yb-v)/(yb-ya)*(H-pad.t*dpr-pad.b*dpr);
  // grid + y ticks
  const {ticks}=niceTicks(ya,yb,8);
  ctx.font = `${11*dpr}px monospace`; ctx.lineWidth=1;
  ticks.forEach(t=>{
    const y=Y(t);
    ctx.strokeStyle='#e5e7eb'; ctx.setLineDash([4*dpr,4*dpr]);
    ctx.beginPath(); ctx.moveTo(pad.l*dpr,y); ctx.lineTo(W-pad.r*dpr,y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#4b5563'; ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(String(t), pad.l*dpr-6*dpr, y);
  });
  // x ticks
  const xt=niceTicks(xa,xb,10);
  ctx.textAlign='center'; ctx.textBaseline='top';
  xt.ticks.forEach(t=>{
    const x=X(t);
    ctx.strokeStyle='#e5e7eb'; ctx.setLineDash([4*dpr,4*dpr]);
    ctx.beginPath(); ctx.moveTo(x,pad.t*dpr); ctx.lineTo(x,H-pad.b*dpr); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#4b5563';
    ctx.fillText(t.toFixed(1)+'s', x, H-pad.b*dpr+6*dpr);
  });
  // zero line
  if(ya<0&&yb>0){
    const y0=Y(0);
    ctx.strokeStyle='#9ca3af'; ctx.lineWidth=1.5*dpr;
    ctx.beginPath(); ctx.moveTo(pad.l*dpr,y0); ctx.lineTo(W-pad.r*dpr,y0); ctx.stroke();
  }
  // step marker t=2.0
  if(xa<=2.0&&2.0<=xb){
    const xs=X(2.0);
    ctx.strokeStyle='#f59e0b'; ctx.setLineDash([6*dpr,4*dpr]); ctx.lineWidth=1.2*dpr;
    ctx.beginPath(); ctx.moveTo(xs,pad.t*dpr); ctx.lineTo(xs,H-pad.b*dpr); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#92400e'; ctx.textAlign='left';
    ctx.fillText('step t=2.0s', xs+4*dpr, pad.t*dpr+2*dpr);
  }
  // axes
  ctx.strokeStyle='#4b5563'; ctx.lineWidth=2*dpr;
  ctx.beginPath(); ctx.moveTo(pad.l*dpr,pad.t*dpr); ctx.lineTo(pad.l*dpr,H-pad.b*dpr); ctx.lineTo(W-pad.r*dpr,H-pad.b*dpr); ctx.stroke();
  // lines
  ctx.lineWidth=2*dpr; ctx.lineJoin='round'; ctx.lineCap='round';
  for(const s of visibleSeries()){
    ctx.strokeStyle=s.color;
    ctx.beginPath();
    let started=false;
    for(const row of DATA){
      const t=row[0]; if(t<xa-1e-9||t>xb+1e-9) continue;
      const x=X(t), y=Y(row[s.key]);
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  // store transform for hover
  cv._X=X; cv._Y=Y; cv._xa=xa; cv._xb=xb; cv._ya=ya; cv._yb=yb;
}
function nearest(t){
  let lo=0, hi=DATA.length-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(DATA[m][0]<t) lo=m; else hi=m; }
  return Math.abs(DATA[lo][0]-t)<=Math.abs(DATA[hi][0]-t)?lo:hi;
}
cv.addEventListener('mousemove', e=>{
  const r=cv.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width*cv.width;
  const xa=cv._xa, xb=cv._xb;
  const padL=pad.l*(window.devicePixelRatio||1), padR=pad.r*(window.devicePixelRatio||1);
  const t=xa+(px-padL)/(cv.width-padL-padR)*(xb-xa);
  const tc=Math.min(Math.max(t,xa),xb);
  const i=nearest(tc), row=DATA[i];
  let h='<b>t = '+row[0].toFixed(3)+' s</b><br><hr style="border-color:#555;margin:4px 0">';
  for(const s of SERIES){
    if(!s.on) continue;
    h+='<span style="color:'+s.color+'">●</span> '+s.label+': <b>'+row[s.key].toFixed(3)+'</b> '+s.unit+'<br>';
  }
  tip.innerHTML=h; tip.style.opacity='1';
  tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
});
cv.addEventListener('mouseleave', ()=>{ tip.style.opacity='0'; });
// checkboxes
const box=document.getElementById('checks');
SERIES.forEach(s=>{
  const lab=document.createElement('label'); lab.className='chk';
  const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=s.on;
  cb.addEventListener('change', ()=>{ s.on=cb.checked; draw(); });
  const d=document.createElement('span'); d.className='dot'; d.style.color=s.color; d.textContent='●';
  const tx=document.createElement('span'); tx.textContent=s.label;
  lab.appendChild(cb); lab.appendChild(d); lab.appendChild(tx);
  box.appendChild(lab);
  s._cb=cb;
});
document.getElementById('allOn').onclick=()=>{ SERIES.forEach(s=>{s.on=true;s._cb.checked=true;}); draw(); };
document.getElementById('allOff').onclick=()=>{ SERIES.forEach(s=>{s.on=false;s._cb.checked=false;}); draw(); };
document.querySelectorAll('.xrange').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.xrange').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const v=b.dataset.r;
    if(v==='full') xRange=null;
    else if(v==='dyn') xRange=[0,8];
    else if(v==='step') xRange=[1.5,6.5];
    else if(v==='steady') xRange=[5,40.3];
    draw();
  };
});
document.getElementById('autoscale').addEventListener('change', draw);
window.addEventListener('resize', draw);
// meta
(function(){
  const posMin=Math.min(...DATA.map(r=>r[2]));
  const pMin=Math.min(...DATA.map(r=>r[4]));
  const spdMin=Math.min(...DATA.map(r=>r[8]));
  const m='rows='+DATA.length+'   t='+DATA[0][0].toFixed(1)+'..'+DATA[DATA.length-1][0].toFixed(3)+'s'
   +'   target 0→-90° @t=2.0s   pos_min='+posMin.toFixed(3)+'° (overshoot '+(-90-posMin>0?(-90-posMin).toFixed(3):'0')+'° beyond -90)'
   +'   p_min='+pMin.toFixed(1)+'  speed_min='+spdMin.toFixed(1)+' deg/s';
  document.getElementById('meta').textContent=m;
})();
draw();
</script>
</body>
